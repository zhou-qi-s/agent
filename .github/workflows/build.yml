name: Build Agent (ARM64 + AMD64)

# ★ 2026-10-08 改造：编译放进【老 glibc 的容器】里跑，产物才不会要求 22.04 的 glibc 2.35。
#   原来直接跑在 ubuntu-22.04(-arm) runner 上 → main.bin 里刻着 GLIBC_2.35
#   → 麒麟 V10（glibc 2.28）加载时报 "version `GLIBC_2.35' not found"。
#   现在跑在 quay.io/pypa/manylinux_2_28_*（AlmaLinux 8 基底，glibc 2.28）里
#   → 产物 floor = 2.28 = 麒麟 V10，正好够用。
#   想更保险（兼容 CentOS 7 那类 2.17 的机器），把下面两处 image 换成
#   quay.io/pypa/manylinux2014_aarch64 / quay.io/pypa/manylinux2014_x86_64（glibc 2.17）。
#
#   ⚠️ 注意：job 级 if 里【不能】用 matrix 上下文（GitHub 不支持，会直接
#      "Invalid workflow file"，一个 job 都不起）。所以 arm64 / amd64 保持两个独立 job。

on:
  workflow_dispatch:
    inputs:
      build_arch:
        description: "Which arch to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - arm64
          - amd64

jobs:
  build-arm64:
    name: Build ARM64
    if: ${{ github.event.inputs.build_arch == 'both' || github.event.inputs.build_arch == 'arm64' }}
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build inside old-glibc container
        # 在 runner 上直接 docker run（而不是用 container:），
        # 好处：checkout 用 runner 自带 git，容器里不需要装 git。
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e PYTHON_BIN=/opt/python/cp39-cp39/bin/python \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -lc 'chmod +x .github/ci-build.sh && .github/ci-build.sh'

      - name: Verify output (arch + glibc floor)
        run: |
          set -e
          ls -la linux_release/
          tar -tzf linux_release/agent-linux.tar.gz | head -20

          mkdir -p /tmp/vx && rm -rf /tmp/vx/* && tar -xzf linux_release/agent-linux.tar.gz -C /tmp/vx
          BIN=$(find /tmp/vx -type f \( -name 'main.bin' -o -name 'main' \) | head -1)
          echo "主程序: $BIN"
          file "$BIN"

          # 整个 dist 里所有 ELF 需要的最高 glibc 符号 = 目标节点必须 ≥ 这个版本
          FLOOR=$(for f in $(find /tmp/vx -type f); do strings "$f" 2>/dev/null | grep -o 'GLIBC_2\.[0-9]*'; done | sort -V | tail -1)
          echo "★ 产物需要的最高 glibc = ${FLOOR:-未读到}   （麒麟 V10 = 2.28）"
          case "$FLOOR" in
            GLIBC_2.1[0-9]|GLIBC_2.2[0-8]) echo "✓ 兼容麒麟 V10（2.28）" ;;
            *) echo "::warning::产物要求 ${FLOOR}，可能高于麒麟 V10 的 2.28，请确认目标节点 glibc" ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-arm64
          path: linux_release/agent-linux.tar.gz
          retention-days: 14

  build-amd64:
    name: Build AMD64
    if: ${{ github.event.inputs.build_arch == 'both' || github.event.inputs.build_arch == 'amd64' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build inside old-glibc container
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e PYTHON_BIN=/opt/python/cp39-cp39/bin/python \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -lc 'chmod +x .github/ci-build.sh && .github/ci-build.sh'

      - name: Verify output (arch + glibc floor)
        run: |
          set -e
          ls -la linux_release/
          tar -tzf linux_release/agent-linux.tar.gz | head -20

          mkdir -p /tmp/vx && rm -rf /tmp/vx/* && tar -xzf linux_release/agent-linux.tar.gz -C /tmp/vx
          BIN=$(find /tmp/vx -type f \( -name 'main.bin' -o -name 'main' \) | head -1)
          echo "主程序: $BIN"
          file "$BIN"

          FLOOR=$(for f in $(find /tmp/vx -type f); do strings "$f" 2>/dev/null | grep -o 'GLIBC_2\.[0-9]*'; done | sort -V | tail -1)
          echo "★ 产物需要的最高 glibc = ${FLOOR:-未读到}   （麒麟 V10 = 2.28）"
          case "$FLOOR" in
            GLIBC_2.1[0-9]|GLIBC_2.2[0-8]) echo "✓ 兼容麒麟 V10（2.28）" ;;
            *) echo "::warning::产物要求 ${FLOOR}，可能高于麒麟 V10 的 2.28，请确认目标节点 glibc" ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-amd64
          path: linux_release/agent-linux.tar.gz
          retention-days: 14
