name: Build Agent (ARM64 + AMD64)

on:
  workflow_dispatch:
    inputs:
      build_arch:
        description: "Which arch to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - arm64
          - amd64

jobs:
  build-arm64:
    name: Build ARM64
    if: ${{ github.event.inputs.build_arch == 'both' || github.event.inputs.build_arch == 'arm64' }}
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          python3 --version
          gcc --version | head -1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev gcc patchelf ccache

      - name: Build with Nuitka
        run: |
          # ★ 必须用 build_offline.sh（完整离线打包流水线）：
          #   它生成的 stop_agent.sh 含「第 4.5 段 —— 停止时一并清 promtail」。
          #   ✗ 不要换成 nuitka_linux_build.sh：那个脚本生成的 stop_agent.sh 没有该段，
          #     会导致「取消纳管后节点上的 promtail 仍在继续往 Loki 推日志」。
          chmod +x build_offline.sh
          PYTHON_BIN=python3 ./build_offline.sh 2>&1 | tail -60

      - name: Verify output
        run: |
          ls -la linux_release/
          tar -tzf linux_release/agent-linux.tar.gz | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-arm64
          path: linux_release/agent-linux.tar.gz
          retention-days: 7

  build-amd64:
    name: Build AMD64
    if: ${{ github.event.inputs.build_arch == 'both' || github.event.inputs.build_arch == 'amd64' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          python3 --version
          gcc --version | head -1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev gcc patchelf ccache

      - name: Build with Nuitka
        run: |
          # ★ 必须用 build_offline.sh（完整离线打包流水线）：
          #   它生成的 stop_agent.sh 含「第 4.5 段 —— 停止时一并清 promtail」。
          #   ✗ 不要换成 nuitka_linux_build.sh：那个脚本生成的 stop_agent.sh 没有该段，
          #     会导致「取消纳管后节点上的 promtail 仍在继续往 Loki 推日志」。
          chmod +x build_offline.sh
          PYTHON_BIN=python3 ./build_offline.sh 2>&1 | tail -60

      - name: Verify output
        run: |
          ls -la linux_release/
          tar -tzf linux_release/agent-linux.tar.gz | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-amd64
          path: linux_release/agent-linux.tar.gz
          retention-days: 7
