name: Build Agent (ARM64 + AMD64)

on:
  workflow_dispatch:
    inputs:
      build_arch:
        description: "Which arch to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - arm64
          - amd64

jobs:
  build-arm64:
    name: Build ARM64
    if: ${{ github.event.inputs.build_arch == 'both' || github.event.inputs.build_arch == 'arm64' }}
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -m
          python3 --version
          gcc --version | head -1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev gcc patchelf ccache
          python3 -m pip install -U pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -U nuitka ordered-set zstandard httptools anyio h11

      - name: Build with Nuitka (build_offline.sh)
        run: |
          chmod +x build_offline.sh
          PYTHON_BIN=python3 ./build_offline.sh 2>&1 | tail -80

      - name: Verify output
        run: |
          ls -la linux_release/
          echo "--- package contents (scripts + core) ---"
          tar -tzf linux_release/agent-linux.tar.gz | grep -E '\.sh$|core/|main.bin'
          echo "--- main.bin arch ---"
          file linux_release_tmp 2>/dev/null || true
          mkdir -p /tmp/chk && tar -xzf linux_release/agent-linux.tar.gz -C /tmp/chk main.dist/main.bin
          file /tmp/chk/main.dist/main.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-arm64
          path: linux_release/agent-linux.tar.gz
          retention-days: 7

  build-amd64:
    name: Build AMD64
    if: ${{ github.event.inputs.build_arch == 'both' || github.event.inputs.build_arch == 'amd64' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -m
          python3 --version
          gcc --version | head -1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev gcc patchelf ccache
          python3 -m pip install -U pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -U nuitka ordered-set zstandard httptools anyio h11

      - name: Build with Nuitka (build_offline.sh)
        run: |
          chmod +x build_offline.sh
          PYTHON_BIN=python3 ./build_offline.sh 2>&1 | tail -80

      - name: Verify output
        run: |
          ls -la linux_release/
          echo "--- package contents (scripts + core) ---"
          tar -tzf linux_release/agent-linux.tar.gz | grep -E '\.sh$|core/|main.bin'
          echo "--- main.bin arch ---"
          mkdir -p /tmp/chk && tar -xzf linux_release/agent-linux.tar.gz -C /tmp/chk main.dist/main.bin
          file /tmp/chk/main.dist/main.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-amd64
          path: linux_release/agent-linux.tar.gz
          retention-days: 7
